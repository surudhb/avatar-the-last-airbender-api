<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%"   stop-color="#1e4a8a"/>
      <stop offset="100%" stop-color="#07111e"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Deep-blue circular background -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>

  <!-- Air Nomad arrow tattoo — upward arrow with splayed tail -->
  <g filter="url(#glow)" fill="none" stroke="#ffffff"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- Shaft -->
    <line x1="16" y1="22" x2="16" y2="10" stroke-width="2.6"/>
    <!-- Head -->
    <path d="M10.5 15.5 L16 9 L21.5 15.5" stroke-width="2.6"/>
    <!-- Tail flare (mimics the splayed feather on the tattoo) -->
    <path d="M12.5 22 Q16 25.5 19.5 22" stroke-width="2"/>
  </g>
</svg>
