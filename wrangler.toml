name = "avatar-the-last-airbender-api"
main = "src/index.js"
compatibility_date = "2025-09-15"

# D1 SQLite database (free tier: 5GB storage, 5M row reads/day)
# After creating: wrangler d1 create avatar-api  →  paste the returned database_id below
[[d1_databases]]
binding = "DB"
database_name = "avatar-api"
database_id = "placeholder-run-wrangler-d1-create-avatar-api"

# Static assets served alongside the Worker (public/ directory)
[assets]
directory = "./public"
binding = "ASSETS"
